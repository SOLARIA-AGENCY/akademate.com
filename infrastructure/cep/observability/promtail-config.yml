server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://46.225.4.189:5000/loki/api/v1/push

scrape_configs:
  - job_name: cep-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
      - target_label: site
        replacement: cep-ovh
      - target_label: environment
        replacement: production
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            timestamp: time
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: log

  - job_name: cep-ufw
    static_configs:
      - targets: [localhost]
        labels:
          job: ufw
          site: cep-ovh
          __path__: /var/log/ufw.log
