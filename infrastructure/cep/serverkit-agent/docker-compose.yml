# CEP OVH ServerKit agent. Panel lives on C-BIAS :5000 (Hetzner firewall + UFW
# allow 37.59.119.219 only). Exec stays disabled in the agent config volume.
# Hostname + machine-id must be stable: agent.key is AES-GCM bound to host id.
# Always register with `docker exec serverkit-agent serverkit-agent register ...`
# never with a throwaway `docker run --rm` (that writes a key the live agent
# cannot decrypt).
services:
  serverkit-agent:
    image: jhd3197/serverkit-agent:1.0.4
    container_name: serverkit-agent
    hostname: cep-ovh
    restart: unless-stopped
    group_add:
      - "988"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/machine-id:/etc/machine-id:ro
      - serverkit-agent-config:/etc/serverkit-agent
      - serverkit-agent-logs:/var/log/serverkit-agent
    labels:
      akademate.role: cep-ovh-agent
    healthcheck:
      test: ["CMD-SHELL", "test -f /etc/serverkit-agent/config.yaml"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  serverkit-agent-config:
    external: true
    name: serverkit-agent-config
  serverkit-agent-logs:
