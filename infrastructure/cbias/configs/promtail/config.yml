# =============================================================================
# Promtail - Configuracion
# C-BIAS ENTERPRISES
# =============================================================================
# Colecta logs de contenedores Docker y los envia a Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://cbias-loki:3100/loki/api/v1/push

scrape_configs:
  # Logs de contenedores Docker
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project"]
    relabel_configs:
      # Usar nombre del contenedor como label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Usar nombre del servicio compose
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      # Usar nombre del proyecto compose
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      - target_label: 'site'
        replacement: cbias-central
    pipeline_stages:
      # Detectar nivel de log (ERROR, WARN, INFO, DEBUG)
      - regex:
          expression: '(?i)(?P<level>(error|warn|info|debug))'
      - labels:
          level:

