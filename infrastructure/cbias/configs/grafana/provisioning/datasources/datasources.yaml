apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: P8E80F9AEF21F6940
    access: proxy
    url: http://cbias-loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      timeout: 60

  - name: Prometheus
    type: prometheus
    uid: PBFA97CFB590B2093
    access: proxy
    url: http://cbias-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      queryTimeout: 60s
      httpMethod: POST

  - name: Hetzner Cloud
    type: apricote-hcloud-datasource
    uid: P_HCLOUD_CBIAS_001
    access: proxy
    url: https://api.hetzner.cloud/v1
    editable: false
    secureJsonData:
      apiToken: ${HETZNER_API_TOKEN}
