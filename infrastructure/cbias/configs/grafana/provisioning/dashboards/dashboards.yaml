# =============================================================================
# Grafana - Provisioning de Dashboards
# C-BIAS ENTERPRISES
# =============================================================================

apiVersion: 1

providers:
  - name: 'C-BIAS Dashboards'
    orgId: 1
    folder: 'C-BIAS'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
