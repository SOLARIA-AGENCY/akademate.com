events {}

http {
  access_log off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 5000 default_server;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location /loki/ {
      proxy_pass http://127.0.0.1:3100;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://127.0.0.1:5002;
      proxy_http_version 1.1;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  # Public status page on :5000 by Host (OVH already allowlisted).
  # Dashboard/login stay on Tailscale :3001.
  server {
    listen 5000;
    server_name status.cepformacion.akademate.com cepformacion-estado.akademate.com;

    add_header X-Content-Type-Options nosniff always;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    absolute_redirect off;
    port_in_redirect off;

    location = /healthz {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location = / {
      return 302 /status/estado;
    }

    location ^~ /status/estado {
      proxy_pass http://100.113.169.104:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/status-page/ {
      proxy_pass http://100.113.169.104:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Content-Length 0;
        return 204;
      }
    }

    location ^~ /assets/ {
      proxy_pass http://100.113.169.104:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location = /icon.svg {
      proxy_pass http://100.113.169.104:3001/icon.svg;
    }

    location = /apple-touch-icon.png {
      proxy_pass http://100.113.169.104:3001/apple-touch-icon.png;
    }

    location = /favicon.ico {
      proxy_pass http://100.113.169.104:3001/favicon.ico;
    }

    location / {
      return 404;
    }
  }
}
