max_cycles: 5
checks:
  level_1:
    - name: next-isolation-tests
      command: node --test scripts/__tests__/akademate-next-isolation.test.mjs
    - name: next-database-role-tests
      command: node --test scripts/__tests__/akademate-next-db-roles.test.mjs
    - name: next-learning-migration-contract
      command: node --test scripts/__tests__/akademate-next-learning-migration.test.mjs
    - name: next-isolation-contract
      command: node scripts/verify-akademate-next-isolation.mjs
    - name: next-mcp-runtime-boundary
      command: corepack pnpm --filter @akademate/mcp-server test && corepack pnpm --filter @akademate/mcp-server build
    - name: next-ui-inventory
      command: node --test scripts/__tests__/akademate-next-ui-inventory.test.mjs && corepack pnpm audit:ui
    - name: next-signage-domain
      command: corepack pnpm --filter @akademate/signage-domain typecheck && corepack pnpm --filter @akademate/signage-adapters typecheck && node --experimental-strip-types --test packages/signage-domain/src/*.test.ts packages/signage-adapters/src/*.test.ts
    - name: next-signage-migration
      command: node --test scripts/__tests__/akademate-next-migration-discovery.test.mjs scripts/__tests__/akademate-next-signage-migration.test.mjs && node --experimental-strip-types --test apps/tenant-admin/src/runtime/next-only-collections.test.ts apps/tenant-admin/src/runtime/select-runtime-migrations.test.ts
    - name: next-event-ticket-types
      command: node --test scripts/__tests__/akademate-next-event-ticket-types-migration.test.mjs && apps/tenant-admin/node_modules/.bin/tsx --test apps/tenant-admin/src/lib/offers/event-ticket-type.test.ts apps/tenant-admin/src/lib/offers/event-ticket-type-command.test.ts
    - name: next-signage-postgres-runtime
      command: bash scripts/verify-next-signage-migration-runtime.sh
    - name: next-offer-conversion
      command: (cd packages/operations && ../../node_modules/.bin/vitest run __tests__/offer-publication.test.ts) && (cd packages/api && ../../node_modules/.bin/vitest run __tests__/validation.test.ts) && node --test scripts/__tests__/akademate-next-offer-conversion-migration.test.mjs scripts/__tests__/akademate-next-offer-runtime-access-migration.test.mjs scripts/__tests__/akademate-next-public-offer-projection-migration.test.mjs scripts/__tests__/akademate-next-public-offer-submission-migration.test.mjs scripts/__tests__/akademate-next-offer-submission-review-migration.test.mjs scripts/__tests__/akademate-next-offer-enrollment-conversion-migration.test.mjs scripts/__tests__/akademate-next-enrollment-lifecycle-migration.test.mjs scripts/__tests__/akademate-next-paid-offer-order-migration.test.mjs scripts/__tests__/akademate-next-enrollment-lifecycle-route.test.mjs scripts/__tests__/akademate-next-offer-route.test.mjs scripts/__tests__/akademate-next-public-offer-route.test.mjs scripts/__tests__/akademate-next-public-offer-submission-route.test.mjs scripts/__tests__/akademate-next-offer-submission-inbox-route.test.mjs scripts/__tests__/akademate-next-paid-offer-route.test.mjs scripts/__tests__/akademate-next-payment-webhook-routes.test.mjs scripts/__tests__/akademate-next-paypal-return-route.test.mjs && apps/tenant-admin/node_modules/.bin/tsx --test apps/tenant-admin/src/lib/offers/offer-configuration-command.test.ts apps/tenant-admin/src/lib/offers/offer-configuration-handler.test.ts apps/tenant-admin/src/lib/offers/offer-submission-inbox-command.test.ts apps/tenant-admin/src/lib/offers/offer-submission-inbox-handler.test.ts apps/tenant-admin/src/lib/offers/offer-submission-review-command.test.ts apps/tenant-admin/src/lib/offers/offer-submission-review-handler.test.ts apps/tenant-admin/src/lib/offers/offer-submission-review-history-command.test.ts apps/tenant-admin/src/lib/offers/offer-submission-review-history-handler.test.ts apps/tenant-admin/src/lib/offers/offer-submission-enrollment-command.test.ts apps/tenant-admin/src/lib/offers/offer-submission-enrollment-handler.test.ts apps/tenant-admin/src/lib/enrollments/enrollment-cancellation-command.test.ts apps/tenant-admin/src/lib/enrollments/enrollment-cancellation-handler.test.ts apps/tenant-admin/src/lib/enrollments/enrollment-detail-command.test.ts apps/tenant-admin/src/lib/enrollments/enrollment-detail-handler.test.ts apps/tenant-admin/src/lib/offers/public-offer-database.test.ts apps/tenant-admin/src/lib/offers/public-offer-query.test.ts apps/tenant-admin/src/lib/offers/public-offer-submission-config.test.ts apps/tenant-admin/src/lib/offers/public-offer-submission.test.ts apps/tenant-admin/src/lib/payments/*.test.ts && corepack pnpm --filter @akademate/ui build && corepack pnpm --filter @akademate/tenant-admin typecheck:next-offers && corepack pnpm --filter @akademate/tenant-admin exec vitest run tests/api/dashboard-namespace-middleware.test.ts __tests__/cursos/offer-configuration.test.tsx __tests__/cursos/public-offer-page.test.tsx __tests__/cursos/offer-submission-inbox.test.tsx __tests__/matriculas/enrollment-cancellation-panel.test.tsx
    - name: next-dashboard-shell
      command: node --test scripts/__tests__/akademate-next-dashboard-projection-migration.test.mjs scripts/__tests__/akademate-next-dashboard-shell-tenant.test.mjs scripts/__tests__/akademate-next-migration-discovery.test.mjs && apps/tenant-admin/node_modules/.bin/tsx --test apps/tenant-admin/src/lib/dashboard/next-dashboard-command.test.ts apps/tenant-admin/src/lib/dashboard/next-dashboard-handler.test.ts && corepack pnpm --filter @akademate/tenant-admin exec vitest run __tests__/dashboard/next-dashboard-home.test.tsx tests/components/AppSidebar.test.tsx tests/components/realtime-provider.test.tsx && corepack pnpm --filter @akademate/ui build && corepack pnpm --filter @akademate/tenant-admin typecheck:next-offers
    - name: next-dashboard-postgres-browser
      command: CI=1 bash scripts/verify-next-public-offer-browser-runtime.sh
    - name: learning-membership-access
      command: node --experimental-strip-types --test packages/learning/src/*.test.ts
    - name: next-runtime-collection-boundary
      command: node --experimental-strip-types --test apps/tenant-admin/src/runtime/select-runtime-collections.test.ts
    - name: next-collection-manifest
      command: node --experimental-strip-types --test apps/tenant-admin/src/runtime/next-only-collections.test.ts
    - name: next-runtime-migration-boundary
      command: node --experimental-strip-types --test apps/tenant-admin/src/runtime/select-runtime-migrations.test.ts
    - name: next-learning-message-vertical
      command: apps/tenant-admin/node_modules/.bin/tsx --test apps/tenant-admin/src/lib/learning/next-learning-auth.test.ts apps/tenant-admin/src/lib/learning/next-learning-transaction.test.ts apps/tenant-admin/src/lib/learning/next-session-profile.test.ts apps/tenant-admin/src/lib/learning/next-session-handler.test.ts apps/tenant-admin/src/lib/learning/send-message-command.test.ts apps/tenant-admin/src/lib/learning/send-message-handler.test.ts packages/learning/src/repository.test.ts
    - name: next-learning-route-boundary
      command: node --test scripts/__tests__/akademate-next-learning-route.test.mjs
    - name: next-compose
      command: node --test scripts/__tests__/akademate-next-payment-release-contract.test.mjs scripts/__tests__/akademate-next-payment-sandbox-preflight.test.mjs && docker compose --env-file infrastructure/akademate-next/.env.example -f infrastructure/akademate-next/compose.yaml config --quiet
    - name: campus-canonical-session
      command: corepack pnpm --filter @akademate/ui build && corepack pnpm --filter @akademate/campus test && corepack pnpm --filter @akademate/campus exec tsc --noEmit
    - name: diff-integrity
      command: git diff --check

evidence_policy:
  final_report: required
  list_unverified: required
  preserve_raw_failures: required

stop_rules:
  - same_failure_twice
  - max_cycles
  - weakened_tests
  - new_regression
  - user_changes_at_risk
  - insufficient_evidence
