max_cycles: 5
checks:
  level_1:
    - name: next-isolation-tests
      command: node --test scripts/__tests__/akademate-next-isolation.test.mjs
    - name: next-database-role-tests
      command: node --test scripts/__tests__/akademate-next-db-roles.test.mjs
    - name: next-learning-migration-contract
      command: node --test scripts/__tests__/akademate-next-learning-migration.test.mjs
    - name: next-isolation-contract
      command: node scripts/verify-akademate-next-isolation.mjs
    - name: next-mcp-runtime-boundary
      command: corepack pnpm --filter @akademate/mcp-server test && corepack pnpm --filter @akademate/mcp-server build
    - name: next-ui-inventory
      command: node --test scripts/__tests__/akademate-next-ui-inventory.test.mjs && corepack pnpm audit:ui
    - name: next-signage-domain
      command: corepack pnpm --filter @akademate/signage-domain typecheck && corepack pnpm --filter @akademate/signage-adapters typecheck && node --experimental-strip-types --test packages/signage-domain/src/*.test.ts packages/signage-adapters/src/*.test.ts
    - name: next-signage-migration
      command: node --test scripts/__tests__/akademate-next-migration-discovery.test.mjs scripts/__tests__/akademate-next-signage-migration.test.mjs && node --experimental-strip-types --test apps/tenant-admin/src/runtime/next-only-collections.test.ts apps/tenant-admin/src/runtime/select-runtime-migrations.test.ts
    - name: next-signage-postgres-runtime
      command: bash scripts/verify-next-signage-migration-runtime.sh
    - name: learning-membership-access
      command: node --experimental-strip-types --test packages/learning/src/*.test.ts
    - name: next-runtime-collection-boundary
      command: node --experimental-strip-types --test apps/tenant-admin/src/runtime/select-runtime-collections.test.ts
    - name: next-collection-manifest
      command: node --experimental-strip-types --test apps/tenant-admin/src/runtime/next-only-collections.test.ts
    - name: next-runtime-migration-boundary
      command: node --experimental-strip-types --test apps/tenant-admin/src/runtime/select-runtime-migrations.test.ts
    - name: next-learning-message-vertical
      command: apps/tenant-admin/node_modules/.bin/tsx --test apps/tenant-admin/src/lib/learning/next-learning-auth.test.ts apps/tenant-admin/src/lib/learning/next-learning-transaction.test.ts apps/tenant-admin/src/lib/learning/send-message-command.test.ts apps/tenant-admin/src/lib/learning/send-message-handler.test.ts packages/learning/src/repository.test.ts
    - name: next-learning-route-boundary
      command: node --test scripts/__tests__/akademate-next-learning-route.test.mjs
    - name: next-compose
      command: docker compose --env-file infrastructure/akademate-next/.env.example -f infrastructure/akademate-next/compose.yaml config --quiet
    - name: campus-canonical-session
      command: corepack pnpm --filter @akademate/ui build && corepack pnpm --filter @akademate/campus test && corepack pnpm --filter @akademate/campus exec tsc --noEmit
    - name: diff-integrity
      command: git diff --check

evidence_policy:
  final_report: required
  list_unverified: required
  preserve_raw_failures: required

stop_rules:
  - same_failure_twice
  - max_cycles
  - weakened_tests
  - new_regression
  - user_changes_at_risk
  - insufficient_evidence
